# Typball UI strings (English). This is the fallback: any key missing from
# another language falls back to the value here, so keep it complete.
# The character after "&" is the menu access key; text after "\t" is the shortcut.
# "{name}" placeholders are substituted by the program.

[meta]
native_name = "English"

