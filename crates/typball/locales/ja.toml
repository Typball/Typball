# Typball の UI 文字列 (日本語)
# 新しい言語を追加するには、このファイルをコピーして翻訳し、src/i18n.rs の LOCALES に登録する。
# "&" の次の文字がメニューのアクセスキー、"\t" 以降がショートカットキー。
# "{name}" はプログラム側で値に置き換えられるプレースホルダ。

