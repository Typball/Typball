[workspace]
resolver = "2"
members = ["crates/typball-core", "crates/typball"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Typball/Typball"

[workspace.dependencies]
typball-core = { path = "crates/typball-core" }

[profile.release]
opt-level = 3
codegen-units = 16
debug = false
strip = true

[patch.crates-io]
# wxdragon-sys の vendored コピー ("Typball patch" で検索。一覧は vendor/README.md):
# 環境変数 WXDRAGON_WEBVIEW_EDGE_STATIC で wxUSE_WEBVIEW_EDGE_STATIC を CMake に渡す、
# ファイルダイアログに選択リストを足す関数 (保存ダイアログの文字コード選択)
wxdragon-sys = { path = "vendor/wxdragon-sys" }
